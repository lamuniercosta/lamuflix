---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: lamuflix-home
  name: ollama
  namespace: lamuflix-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  serviceName: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: lamuflix-home
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - ollama serve & /bin/sh /scripts/ollama-init.sh; wait
        env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        - name: OLLAMA_EMBEDDING_MODEL
          value: all-minilm
        - name: OLLAMA_READY_TIMEOUT_SECONDS
          value: "120"
        - name: OLLAMA_PULL_TIMEOUT_SECONDS
          value: "900"
        - name: OLLAMA_POLL_INTERVAL_SECONDS
          value: "2"
        image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
        name: ollama
        ports:
        - containerPort: 11434
          name: http
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - ollama show "$OLLAMA_EMBEDDING_MODEL" >/dev/null 2>&1
          failureThreshold: 120
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 1536Mi
          requests:
            memory: 768Mi
        volumeMounts:
        - mountPath: /root/.ollama
          name: models
        - mountPath: /scripts
          name: init-script
          readOnly: true
      volumes:
      - configMap:
          name: ollama-init-49g579fk6t
        name: init-script
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/part-of: lamuflix-home
      name: models
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
