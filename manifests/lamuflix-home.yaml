apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/part-of: lamuflix-home
  name: api
  namespace: lamuflix-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: lamuflix-home
    spec:
      containers:
      - env:
        - name: Ollama__Endpoint
          value: http://ollama:11434/
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://aspire-dashboard:18889
        - name: OTEL_SERVICE_NAME
          value: lamuflix-api
        - name: Tmdb__Enabled
          value: "true"
        - name: Tmdb__ApiKey
          valueFrom:
            secretKeyRef:
              key: apiKey
              name: tmdb-credentials
              optional: true
        image: ghcr.io/lamuniercosta/lamuflix-api@sha256:a9dd5192ad2c74aff7ea46492d1b478acf122d29bd20cdf0f3a7c38121c7e191
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 20
        name: api
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
        resources:
          limits:
            memory: 1536Mi
          requests:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
        volumeMounts:
        - mountPath: /app/appsettings.Production.json
          name: api-settings
          readOnly: true
          subPath: appsettings.Production.json
        - mountPath: /media/library
          name: library
          readOnly: false
      initContainers:
      - command:
        - /bin/bash
        - -c
        - |
          for h in postgres:5432 rabbitmq:5672; do
            until (exec 3<>/dev/tcp/${h%:*}/${h#*:}) 2>/dev/null; do sleep 2; done
          done
        image: ghcr.io/lamuniercosta/lamuflix-api@sha256:a9dd5192ad2c74aff7ea46492d1b478acf122d29bd20cdf0f3a7c38121c7e191
        name: wait-postgres-rabbitmq
        resources:
          limits:
            memory: 64Mi
          requests:
            memory: 32Mi
      - command:
        - /bin/bash
        - -c
        - |
          until (exec 3<>/dev/tcp/ollama/11434 && printf 'GET /api/tags HTTP/1.1\r\nHost: ollama\r\nConnection: close\r\n\r\n' >&3 && timeout 5 cat <&3 | grep -q all-minilm); do sleep 3; done
        image: ghcr.io/lamuniercosta/lamuflix-api@sha256:a9dd5192ad2c74aff7ea46492d1b478acf122d29bd20cdf0f3a7c38121c7e191
        name: wait-ollama-model
        resources:
          limits:
            memory: 64Mi
          requests:
            memory: 32Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
      volumes:
      - name: api-settings
        secret:
          secretName: api-settings
      - hostPath:
          path: /media/library
          type: Directory
        name: library
