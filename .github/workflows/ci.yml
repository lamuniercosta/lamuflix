name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-test-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # The opt-in real-model proof (Category=OllamaIntegration) needs Docker plus a
      # model download, so default CI excludes the category and never sets
      # LAMUFLIX_RUN_OLLAMA_TESTS. See docs/adr/ADR-0025-isolated-ollama-test.md.
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=OllamaIntegration"

      - name: Format
        run: dotnet format --verify-no-changes

      - name: Run offline evaluation
        id: evaluation
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/run-evaluation.ps1
          exit $LASTEXITCODE

      - name: Publish evaluation metrics to job summary
        if: always()
        shell: pwsh
        run: |
          $summaryPath = 'artifacts/evaluation/metrics-summary.json'
          '## Offline evaluation metrics' >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path $summaryPath) {
            $metrics = Get-Content $summaryPath -Raw | ConvertFrom-Json
            "- HR@10: $($metrics.hitRateAt10)" >> $env:GITHUB_STEP_SUMMARY
            "- MRR: $($metrics.mrr)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Metrics summary not available; the evaluation run did not publish its metrics file.' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload evaluation metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-metrics
          path: artifacts/evaluation/metrics-summary.json
          if-no-files-found: warn
          retention-days: 7

  web:
    name: web-lint-typecheck-test-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e-smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke
        run: npm run e2e

      - name: Prepare sanitized e2e evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f e2e/.runtime/upload-blocked.txt ]; then
            echo "Upload blocked: generated secret value found in evidence."
            exit 1
          fi
          if [ ! -f e2e/.runtime/upload-allowlist.json ]; then
            echo "No e2e evidence allowlist was produced."
            exit 0
          fi
          rm -rf e2e/.runtime/ci-upload
          mkdir -p e2e/.runtime/ci-upload
          node --input-type=module <<'NODE'
          import { copyFileSync, mkdirSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const root = 'e2e/.runtime';
          const out = path.join(root, 'ci-upload');
          const { files } = JSON.parse(readFileSync(path.join(root, 'upload-allowlist.json'), 'utf8'));
          for (const file of files) {
            const target = path.join(out, file);
            mkdirSync(path.dirname(target), { recursive: true });
            copyFileSync(path.join(root, file), target);
          }
          NODE

      - name: Upload e2e failure evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: web/e2e/.runtime/ci-upload
          if-no-files-found: ignore
          retention-days: 7

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build docker/Dockerfile.api
        run: docker build -f docker/Dockerfile.api .

      - name: Build docker/Dockerfile.web
        run: docker build -f docker/Dockerfile.web .

  # Whole-Core mutation runs after merge to main (or on manual dispatch), not on PRs; the
  # diff-scoped gate (run-mutation.ps1) still runs pre-PR. With coverage-analysis=off every
  # mutant runs the whole eligible unit suite, so one job outgrew its limit (cancelled at 2 h).
  # The Core source files are therefore split over parallel shards (scripts/ci-stryker-shard.sh,
  # balanced by line count) with a 60 minute cap each; stryker-core-gate then merges the shard
  # reports and applies the one real gate (run-mutation.ps1 -EvaluateReport) to all of Core:
  # the score threshold, kill-share and file-span rules are unchanged, not per-shard.
  stryker-core:
    name: stryker-core (shard ${{ matrix.shard }}/8)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Stryker on Core shard
        run: bash ./scripts/ci-stryker-shard.sh run ${{ matrix.shard }} 8 "${{ runner.temp }}/stryker-core"

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/stryker-core/reports/mutation-report.json
          if-no-files-found: error
          retention-days: 7

  stryker-core-gate:
    name: stryker-core-gate
    needs: stryker-core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: stryker-shard-*
          path: ${{ runner.temp }}/shards

      - name: Merge shard reports
        run: |
          set -euo pipefail
          bash ./scripts/ci-stryker-shard.sh merge "${{ runner.temp }}/mutation-report.json" \
            "${{ runner.temp }}"/shards/stryker-shard-*/mutation-report.json

      - name: Evaluate whole-Core mutation gate
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/run-mutation.ps1 -EvaluateReport "${{ runner.temp }}/mutation-report.json"
          exit $LASTEXITCODE

      - name: Upload merged Stryker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report-core
          path: ${{ runner.temp }}/mutation-report.json
          if-no-files-found: error
          retention-days: 14

  property-tests:
    name: property-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Property tests (LamuFlix.UnitTests)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/run-property-tests.ps1 -Project tests/LamuFlix.UnitTests/LamuFlix.UnitTests.csproj
          exit $LASTEXITCODE

      - name: Property tests (LamuFlix.IntegrationTests)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/run-property-tests.ps1 -Project tests/LamuFlix.IntegrationTests/LamuFlix.IntegrationTests.csproj
          exit $LASTEXITCODE
