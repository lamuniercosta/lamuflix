name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-test-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Format
        run: dotnet format --verify-no-changes

  web:
    name: web-lint-typecheck-test-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e-smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke
        run: npm run e2e

      - name: Prepare sanitized e2e evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f e2e/.runtime/upload-blocked.txt ]; then
            echo "Upload blocked: generated secret value found in evidence."
            exit 1
          fi
          if [ ! -f e2e/.runtime/upload-allowlist.json ]; then
            echo "No e2e evidence allowlist was produced."
            exit 0
          fi
          rm -rf e2e/.runtime/ci-upload
          mkdir -p e2e/.runtime/ci-upload
          node --input-type=module <<'NODE'
          import { copyFileSync, mkdirSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const root = 'e2e/.runtime';
          const out = path.join(root, 'ci-upload');
          const { files } = JSON.parse(readFileSync(path.join(root, 'upload-allowlist.json'), 'utf8'));
          for (const file of files) {
            const target = path.join(out, file);
            mkdirSync(path.dirname(target), { recursive: true });
            copyFileSync(path.join(root, file), target);
          }
          NODE

      - name: Upload e2e failure evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: web/e2e/.runtime/ci-upload
          if-no-files-found: ignore
          retention-days: 7

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build docker/Dockerfile.api
        run: docker build -f docker/Dockerfile.api .

      - name: Build docker/Dockerfile.web
        run: docker build -f docker/Dockerfile.web .

  # Whole-Core mutation takes ~25 min, so it runs after merge to main (or on manual
  # dispatch), not on PRs. The diff-scoped gate (run-mutation.ps1) still runs pre-PR.
  stryker-core:
    name: stryker-core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Run whole-Core Stryker
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/run-mutation.ps1 -WholeProject -OutputRoot "${{ runner.temp }}/stryker-core"
          exit $LASTEXITCODE

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report-core
          path: |
            ${{ runner.temp }}/stryker-core/LamuFlix.Core/reports/mutation-report.html
            ${{ runner.temp }}/stryker-core/LamuFlix.Core/reports/mutation-report.json
          if-no-files-found: error

  property-tests:
    name: property-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Property tests (LamuFlix.UnitTests)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/run-property-tests.ps1 -Project tests/LamuFlix.UnitTests/LamuFlix.UnitTests.csproj
          exit $LASTEXITCODE

      - name: Property tests (LamuFlix.IntegrationTests)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/run-property-tests.ps1 -Project tests/LamuFlix.IntegrationTests/LamuFlix.IntegrationTests.csproj
          exit $LASTEXITCODE
