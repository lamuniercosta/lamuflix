name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-test-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Format
        run: dotnet format --verify-no-changes

  web:
    name: web-lint-typecheck-test-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docker/Dockerfile.api
        run: docker build -f docker/Dockerfile.api .

      - name: Build docker/Dockerfile.web
        run: docker build -f docker/Dockerfile.web .

  # Whole-Core mutation takes ~25 min, so it runs after merge to main (or on manual
  # dispatch), not on PRs. The diff-scoped gate (run-mutation.ps1) still runs pre-PR.
  stryker-core:
    name: stryker-core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Run whole-Core Stryker
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/run-mutation.ps1 -WholeProject -OutputRoot "${{ runner.temp }}/stryker-core"
          exit $LASTEXITCODE

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report-core
          path: |
            ${{ runner.temp }}/stryker-core/LamuFlix.Core/reports/mutation-report.html
            ${{ runner.temp }}/stryker-core/LamuFlix.Core/reports/mutation-report.json
          if-no-files-found: error

  property-tests:
    name: property-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Property tests (LamuFlix.UnitTests)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/run-property-tests.ps1 -Project tests/LamuFlix.UnitTests/LamuFlix.UnitTests.csproj
          exit $LASTEXITCODE

      - name: Property tests (LamuFlix.IntegrationTests)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/run-property-tests.ps1 -Project tests/LamuFlix.IntegrationTests/LamuFlix.IntegrationTests.csproj
          exit $LASTEXITCODE
