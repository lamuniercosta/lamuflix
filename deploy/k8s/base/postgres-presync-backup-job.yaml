apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-presync-backup
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: backup
          image: pgvector/pgvector
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if ! pg_isready -h postgres >/dev/null 2>&1; then
                echo "skipped: postgres not reachable"
                exit 0
              fi
              t=/backups/.lamuflix-home-presync.partial
              trap 'rm -f "$t"' EXIT
              f="/backups/lamuflix-home-presync-$(date +%Y%m%d-%H%M).dump"
              pg_dump -h postgres -U "$POSTGRES_USER" -d lamuflix -Fc --no-owner --no-acl -f "$t"
              pg_restore -l "$t" >/dev/null
              mv "$t" "$f"
              ls -1t /backups/lamuflix-home-presync-*.dump | tail -n +11 | while read -r old; do rm -f -- "$old"; done
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: backups
              mountPath: /backups
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: backups
          hostPath:
            path: /backups
            type: Directory
