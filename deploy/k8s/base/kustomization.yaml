apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lamuflix-home
labels:
  - pairs:
      app.kubernetes.io/part-of: lamuflix-home
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - rabbitmq-statefulset.yaml
  - rabbitmq-service.yaml
  - ollama-statefulset.yaml
  - ollama-service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - postgres-backup-cronjob.yaml
  - postgres-presync-backup-job.yaml
configMapGenerator:
  - name: ollama-init
    files:
      - ../../../docker/ollama-init.sh
