apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aspire-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aspire-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
      containers:
        - name: aspire-dashboard
          # Browser-token auth (the default). The token is printed in the pod log at each start.
          image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
          ports:
            - name: ui
              containerPort: 18888
            - name: otlp-grpc
              containerPort: 18889
          readinessProbe:
            tcpSocket:
              port: ui
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ui
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
