kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lamuflix-home
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 3080
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30100
        hostPort: 3100
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30180
        hostPort: 3180
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30188
        hostPort: 18888
        listenAddress: "127.0.0.1"
        protocol: TCP
    extraMounts:
      - hostPath: '{{LIBRARY_PATH}}'
        containerPath: /media/library
        readOnly: true
      - hostPath: '{{BACKUP_PATH}}'
        containerPath: /backups
