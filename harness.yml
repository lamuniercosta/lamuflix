# dotnet-agent-harness — LamuFlix configuration
harnessVersion: 0.7.1
pack: dotnet
baseBranch: main
tracker: youtrack
solution: null

task:
  worktree: true
  worktreeRoot: F:\Dev\LamuFlix.worktrees

gates:
  complexity:
    implement: 15
    refactor: 6

  mutation:
    threshold: 80
    # What a bare `-WholeProject` run mutates. ci.yml calls it with no -Project, and
    # LamuFlix.UnitTests references both Core and ServiceDefaults, so without this the
    # gate refuses to guess between them and exits 1 with the candidate list.
    wholeProject: LamuFlix.Core
    # Largest share of tested mutants one test may kill (percent, 1..100). Above it the gate
    # fails as a suspected artifact kill: a test that fails on every run inflates the score.
    maxKillShare: 50
    # Most distinct source files one test may kill mutants in (integer >= 1). A unit test
    # spanning more is failing outside the mutation; clean whole-Core runs peak at 9 (DEV-410).
    maxKillFileSpan: 15
    # Test classes exempt from maxKillFileSpan (maxKillShare still applies). Each drives a
    # handler end to end (recommendations), so one test legitimately kills mutants in 16-20
    # files (22 distinct, all on the handler call path; CI run 41277335738). Raising the
    # limit to 22 instead would also pass the 21-file contaminated kill from that branch.
    killFileSpanExempt:
      LamuFlix.UnitTests.Features.Recommendations.GetRecommendationsQueryHandlerTests: "drives the recommendations handler end to end; real reach 20 files"
      LamuFlix.UnitTests.Features.Recommendations.GetRecommendationsQueryHandlerPropertyTests: "properties over the recommendations handler; real reach 19 files"
      LamuFlix.UnitTests.Features.Recommendations.GetForYouRecommendationsQueryHandlerTests: "drives the for-you handler end to end; real reach 18 files"
      LamuFlix.UnitTests.Features.Recommendations.GetForYouRecommendationsQueryHandlerPropertyTests: "properties over the for-you handler; real reach 16 files"
      LamuFlix.UnitTests.Features.Recommendations.ReviewRankingHandlerTests: "drives the recommendation handlers end to end over review signals; real reach 20 files"
    exclusions:
      # Constitution IX scopes mutation to LamuFlix.Core. LamuFlix.UnitTests references
      # both projects below, so the gate prints a stale-exclusion WARNING for each. Their
      # proof needs a real host or database, which IX places in IntegrationTests;
      # mutating Infrastructure had pulled Testcontainers into UnitTests.
      LamuFlix.Api: "host proof lives in IntegrationTests per Constitution IX"
      LamuFlix.Infrastructure: "persistence proof lives in IntegrationTests per Constitution IX"
      # DEV-332: the AppHost is local orchestration wiring; its acceptance proof is
      # real-host receipts, which neither Stryker nor a unit test can produce.
      LamuFlix.AppHost: "local orchestration wiring; real-host acceptance receipts required; Core mutation retained per Constitution IX"
      # DEV-333: test-support fixture library (IsTestProject false), so the gate
      # treats its files as production scope; its sole direct referrer is
      # IntegrationTests, which the gate excludes by design, leaving no eligible unit-test project.
      LamuFlix.Tests.Common: "test-support fixtures only; sole direct referrer is IntegrationTests, which the gate excludes by design; no unit-test project observes its mutants"

  analyzers:
    mode: All
    warningsAsErrors: true

  vulnerablePackages:
    fail: true
    includeTransitive: true

  inspectCode:
    enabled: true

  propertyTests:
    # Repo-wide switch; leave it on. A ticket with no domain invariants records
    # its opt-out in its task note, and the pipeline then accepts the gate's
    # "no tests tagged" exit 2 for that ticket only.
    enabled: true

  web:
    # Off until the Epic 6 scaffold ticket creates web/. While off,
    # run-web-gates.ps1 exits 2 with "SKIPPED - disabled in harness.yml",
    # which every gate rule treats as a non-blocking SKIP. Turn it on in the
    # same PR that adds web/package.json.
    enabled: true

agents:
  tiers:
    fast:
      claude:
        model: claude-haiku-4-5-20251001
        effort: low
      cursor:
        model: gpt-5.6-luna
        effort: low
      codex:
        model: gpt-5.6-terra
        effort: low
    balanced:
      claude:
        model: inherit
        effort: inherit
      cursor:
        model: inherit
        effort: inherit
      codex:
        model: inherit
        effort: inherit
    deep:
      claude:
        model: inherit
        effort: inherit
      cursor:
        model: inherit
        effort: inherit
      codex:
        model: inherit
        effort: inherit
