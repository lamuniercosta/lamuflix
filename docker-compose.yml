services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?message}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?message}
      POSTGRES_DB: lamuflix
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8}
    environment:
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-all-minilm}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_EMBEDDING_MODEL\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s

  ollama-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8}
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-all-minilm}
      OLLAMA_READY_TIMEOUT_SECONDS: ${OLLAMA_READY_TIMEOUT_SECONDS:-120}
      OLLAMA_PULL_TIMEOUT_SECONDS: ${OLLAMA_PULL_TIMEOUT_SECONDS:-900}
      OLLAMA_POLL_INTERVAL_SECONDS: ${OLLAMA_POLL_INTERVAL_SECONDS:-2}
    entrypoint: ["/bin/sh", "/scripts/ollama-init.sh"]
    volumes:
      - ollama-models:/root/.ollama
      - ./docker/ollama-init.sh:/scripts/ollama-init.sh:ro
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?message}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?message}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1; printf ''GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n'' >&3 || exit 1; IFS= read -r -t 5 line <&3 || exit 1; exec 3<&- 3>&-; case $$line in ''HTTP/1.1 200 ''*|''HTTP/1.0 200 ''*) exit 0;; *) exit 1;; esac']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ${LIBRARY_PATH:-./docker/sample-library}:/media/library:ro
      - type: bind
        source: ./docker/api.settings.json
        target: /app/appsettings.Production.json
        read_only: true
        bind:
          create_host_path: false

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ollama-models:
